[install]
exact = true

[lint]
typeAware = true

[lint.rules]
"typescript/no-floating-promises" = "error"
"typescript/no-misused-promises" = ["error", { checksVoidReturn = true }]
"typescript/no-explicit-any" = "error"
"typescript/no-non-null-assertion" = "error"
"react/rules-of-hooks" = "error"
"no-restricted-imports" = [
  "error",
  { patterns = [
    { regex = "(^@bcommerce/api($|/)|(^|/)apps/api/)", message = "Consumers use the serialized OpenAPI client; do not import API internals." },
  ] },
]
