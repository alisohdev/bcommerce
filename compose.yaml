name: bcommerce-m0b
services:
  postgres:
    image: postgres@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    environment:
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation_local_only
      POSTGRES_DB: foundation
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - foundation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgresql://foundation:foundation_local_only@postgres:5432/foundation
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  foundation_pgdata:
